name: Build and Release ZIP for Changed Blender Addons

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install Python toml parser
      run: pip install toml

    - name: Get changed files
      id: changed_files
      run: |
        git fetch --depth=2
        echo "files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})" >> $GITHUB_OUTPUT

    - name: Process changed blender manifests and create zips
      id: pack
      run: |
        changed="${{ steps.changed_files.outputs.files }}"

        if [ -z "$changed" ] || ! echo "$changed" | grep -q 'blender_manifest.toml'; then
          echo "No changed blender_manifest.toml found, skipping packaging."
          echo "created=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        touched_manifests=0
        for file in $changed; do
          if [[ "$file" == */blender_manifest.toml ]]; then
            # (ваш основной код упаковки)
            touched_manifests=1
          fi
        done

        if [ $touched_manifests -eq 0 ]; then
          echo "No blender_manifest.toml files were processed."
          echo "created=false" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "created=true" >> $GITHUB_OUTPUT
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
        fi
    
    - name: List root dir after zipping
      run: ls -l

    - name: Create and push tag
      if: steps.pack.outputs.created == 'true'
      id: tag
      run: |
        TAG="release-$(date +'%Y%m%d%H%M%S')"
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git tag $TAG
        git push origin $TAG
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: steps.pack.outputs.created == 'true'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        release_name: ${{ steps.pack.outputs.release_name }}
        draft: false
        prerelease: false

    - name: Upload each release zip file to GitHub Release
      if: steps.pack.outputs.created == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        shopt -s nullglob
        files=(*.zip)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No zip files to upload"
          exit 0
        fi
        for zipfile in "${files[@]}"; do
          echo "Uploading $zipfile"
          gh release upload ${{ steps.create_release.outputs.tag_name }} "$zipfile" --clobber
        done 