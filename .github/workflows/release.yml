name: Build and Release ZIP for Changed Blender Addons

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install Python toml parser
      run: pip install toml

    - name: Get changed files
      id: changed_files
      run: |
        git fetch --depth=2
        echo "files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})" >> $GITHUB_OUTPUT
    
    - name: Process changed blender manifests and create zips
      id: pack
      run: |
        changed="${{ steps.changed_files.outputs.files }}"

        if [ -z "$changed" ] || ! echo "$changed" | grep -q 'blender_manifest.toml'; then
          echo "No changed blender_manifest.toml found, skipping packaging."
          echo "created=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # проверяем есть ли файл blender_manifest.toml в текущем коммите
        touched_manifests=0
        zip_paths=""
        zip_sizes=""
        zip_hashes=""

        for file in $changed; do
          if [[ "$file" == */blender_manifest.toml ]]; then
            touched_manifests=1
          fi
        done

        # если файла blender_manifest.toml в коммите нет
        if [ $touched_manifests -eq 0 ]; then 
          echo "No blender_manifest.toml files were processed."
          echo "created=false" >> $GITHUB_OUTPUT
          exit 0
        else
          for file in $changed; do
            if [[ "$file" == */blender_manifest.toml ]]; then
              dir=$(dirname "$file")

              schema_version=$(python -c "import toml; print(toml.load('$file')['schema_version'])")
              name=$(python -c "import toml; print(toml.load('$file')['name'])")
              id=$(python -c "import toml; print(toml.load('$file')['id'])")
              version=$(python -c "import toml; print(toml.load('$file')['version'])")
              tagline=$(python -c "import toml; print(toml.load('$file')['tagline'])")
              maintainer=$(python -c "import toml; print(toml.load('$file')['maintainer'])")
              type=$(python -c "import toml; print(toml.load('$file')['type'])")
              tags=$(python -c "import toml; print(toml.load('$file')['tags'])")
              blender_version=$(python -c "import toml; print(toml.load('$file')['blender_version_min'])")
              license=$(python -c "import toml; print(toml.load('$file')['license'])")
              copyright=$(python -c "import toml; print(toml.load('$file')['copyright'])")


              zipname="${id}_${version}-blender-${blender_version}.zip"
              
              (cd "$dir" && zip -r "../$zipname" . -x "__pycache__/*" "*.pyc" ".vscode/*") || (echo "Failed to create zip: $zipname" && exit 1)
              touched_manifests=1

              zip_path="$dir/../$zipname"
              size=$(stat -c%s "$zip_path")
              hash=$(sha256sum "$zip_path" | cut -d' ' -f1)
              _zip_paths+="$zip_path,"
              _zip_sizes+="${size},"
              _zip_hashes+="${hash},"

              echo "zipname variable is: $zipname"
              echo "Archiving directory: $dir"
            fi
          done

          zip_paths=${_zip_paths%,}
          zip_sizes=${_zip_sizes%,}
          zip_hashes=${_zip_hashes%,}
          echo "zip_paths=$zip_paths" >> $GITHUB_OUTPUT
          echo "zip_sizes=$zip_sizes" >> $GITHUB_OUTPUT
          echo "zip_hashes=$zip_hashes" >> $GITHUB_OUTPUT

          description=""

          IFS=',' read -r -a paths_array <<< "$zip_paths"
          IFS=',' read -r -a sizes_array <<< "$zip_sizes"
          IFS=',' read -r -a hashes_array <<< "$zip_hashes"

          for i in "${!paths_array[@]}"; do
            size_clean=$(echo "${sizes_array[i]}" | xargs)
            hash_clean=$(echo "${hashes_array[i]}" | xargs)
            path_clean=$(echo "${paths_array[i]}" | xargs)

            description+="Архив: $path_clean
          Размер: $size_clean байт
          SHA256: $hash_clean

          "
          done

          echo "release_description<<EOF" >> $GITHUB_OUTPUT
          echo "$description" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ $touched_manifests -eq 0 ]; then
            echo "No blender_manifest.toml files were processed."
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "created=true" >> $GITHUB_OUTPUT
            release_name="${id}_${version}-blender-${blender_version}"
            echo "release_name=$release_name" >> $GITHUB_OUTPUT
            echo "addon_name=${id}" >> $GITHUB_OUTPUT
            
            echo "addon_schema_version=$schema_version" | tostring >> $GITHUB_OUTPUT
            echo "addon_id=$id" >> $GITHUB_OUTPUT
            echo "addon_name=$name" >> $GITHUB_OUTPUT
            echo "addon_version=$version" >> $GITHUB_OUTPUT
            echo "addon_tagline=$tagline" >> $GITHUB_OUTPUT
            echo "addon_maintainer=$maintainer" >> $GITHUB_OUTPUT
            echo "addon_type=$type" >> $GITHUB_OUTPUT
            echo "addon_tags=$tags" >> $GITHUB_OUTPUT
            echo "addon_blender_version=$blender_version" >> $GITHUB_OUTPUT
            echo "addon_license=$license" >> $GITHUB_OUTPUT
            echo "addon_copyright=$copyright" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Edit index.json
      if: steps.pack.outputs.created == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        json_path="index.json"
        if [ -f "$json_path" ]; then
          echo "index.json exists"
        else
          echo "index.json not found"
        fi
        
        # блок внесения изменений в json файл =======================================================================================
        jq --arg id "$addon_id" --arg ver "$addon_version" --arg url "$archive_url" --arg size "$archive_size" --arg hash "$archive_hash" '
        
        # Проверяем, есть ли элемент с id
        if (.data | map(.id) | index($id)) != null then
          schema_version=${{ steps.pack.outputs.addon_schema_version }}
          id=${{ steps.pack.outputs.addon_id }}
          name=${{ steps.pack.outputs.addon_name }}
          tagline=${{ steps.pack.outputs.addon_tagline }}
          version=${{ steps.pack.outputs.addon_version }}
          type=${{ steps.pack.outputs.addon_type }}
          maintainer=${{ steps.pack.outputs.addon_maintainer }}
          license=${{ steps.pack.outputs.addon_license }}
          blender_version_min=${{ steps.pack.outputs.addon_blender_version }}
          permissions=${{ steps.pack.outputs.addon_permissions }}
          tags=${{ steps.pack.outputs.addon_tags }}
          python_versions=${{ steps.pack.outputs.python_versions }}
          archive_url=${{ steps.pack.outputs.url }}
          archive_size=${{ steps.pack.outputs.size }}
          archive_hash=${{ steps.pack.outputs.hash }}

          # Обновляем элемент
          (.data[] | select(.id == $id)) |=
            . + {
              schema_version: ($schema_version | tostring),
              id: $id,
              name: $name,
              tagline: $tagline,
              version: $version,
              type: $type,
              maintainer: $maintainer,
              license: $license,
              blender_version_min: $blender_version_min,
              permissions: $permissions,
              tags: $tags,
              python_versions: $python_versions,
              archive_url: $archive_url,
              archive_size: ($archive_size | tonumber),
              archive_hash: $archive_hash
            }
        else
          # Добавляем новый объект в массив data
          .data += [{
            schema_version: ($schema_version | tonumber),
            id: $id,
            name: $name,
            tagline: $tagline,
            version: $version,
            type: $type,
            maintainer: $maintainer,
            license: $license,
            blender_version_min: $blender_version_min,
            permissions: $permissions,
            tags: $tags,
            python_versions: $python_versions,
            archive_url: $archive_url,
            archive_size: ($archive_size | tonumber),
            archive_hash: $archive_hash
          }]
        end
        ' index.json > tmp.json && mv tmp.json index.json
        # =========================================================================================================================
        
        # git config user.name "github-actions"
        # git config user.email "actions@github.com"
        # git add "$file_path"
        # git commit -m "Update index.json"
        # git push


    - name: Create and push tag
      if: steps.pack.outputs.created == 'true'
      id: tag
      run: |
        TAG="release-$(date +'%Y%m%d%H%M%S')"
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        if ! git diff --cached --quiet; then
          git commit -m "Update index.json"
          git push
        else
          echo "No changes to commit"
        fi

        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: steps.pack.outputs.created == 'true'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        #tag_name: ${{ steps.pack.outputs.addon_name }}_latest
        release_name: ${{ steps.pack.outputs.addon_name }}_latest

        body: |
          Версия релиза: ${{ steps.pack.outputs.release_name }}

          Вставьте этот путь в качестве репозитория в разделе Git Extensions параметров blender:
            https://raw.githubusercontent.com/elevenlevel/BlAddons/refs/heads/main/Extensions/index.json
          
          Таким образом у вас всегда будут самые свежие версии аддонов.

          ${{ steps.pack.outputs.release_description }}
        
        draft: false
        prerelease: false

    - name: Upload each release zip file to GitHub Release
      if: steps.pack.outputs.created == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        shopt -s nullglob

        IFS=',' read -r -a dirs_array <<< "${{ steps.pack.outputs.zip_paths }}"

        for path in "${dirs_array[@]}"; do
          echo "$path"
          addon_name_latest=${{ steps.pack.outputs.addon_name }}
          echo "Uploading $zipfile"
          gh release upload ${{ steps.tag.outputs.tag }} "$path" --clobber
          done 