name: Build and Release ZIP for Changed Blender Addons

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install Python toml parser
      run: pip install toml

    - name: Get changed files
      id: changed_files
      run: |
        git fetch --depth=2  # обеспечить наличие последних коммитов
        echo "files=$(git diff --name-only origin/main...HEAD)" >> $GITHUB_OUTPUT

    - name: Process changed blender manifests and create zips
      id: pack
      run: |
        changed="${{ steps.changed_files.outputs.files }}"

        if [ -z "$changed" ] || ! echo "$changed" | grep -q 'blender_manifest.toml$'; then
          echo "No changed blender_manifest.toml found, skipping packaging."
          exit 0
        fi

        touched_manifests=0
        echo "XXXXXXXXXXXXXXXXXX"

        for file in $changed; do
          if [[ "$file" == */blender_manifest.toml ]]; then
            echo "Found changed manifest: $file"
            dir=$(dirname "$file")
            echo "$dir"
            id=$(python -c "import toml; print(toml.load('$file')['id'])")
            version=$(python -c "import toml; print(toml.load('$file')['version'])")
            blender_version=$(python -c "import toml; print(toml.load('$file')['blender_version_min'])")
            zipname="${id}_${version}-blender-${blender_version}.zip"
            zip -r "$zipname" "$dir"
            touched_manifests=1
          fi
        done

        if [ $touched_manifests -eq 0 ]; then
          echo "No blender_manifest.toml files were processed."
          exit 0
        fi
    
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}  # замените на тег, если есть
        release_name: Release ${{ steps.tag.outputs.tag }}
        draft: false
        prerelease: false

    - name: Upload each release zip file to GitHub Release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for zipfile in *.zip; do
          echo "Uploading $zipfile"
          gh release upload ${{ steps.create_release.outputs.tag_name }} "$zipfile" --clobber
        done