name: Build and Release ZIP for Changed Blender Addons

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Python toml parser
      run: pip install toml

    - name: Get changed files
      id: changed_files
      run: |
        git fetch --depth=2
        echo "files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})" >> $GITHUB_OUTPUT

        if [ -z "$changed" ] || ! echo "$changed" | grep -q 'blender_manifest.toml'; then
          echo "No changed blender_manifest.toml found, skipping packaging."
          echo "changed_toml=false" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "changed_toml=true" >> $GITHUB_OUTPUT
        fi

    - name: Create TAG
      id: tag
      run: |
        TAG="release-$(date +'%Y%m%d%H%M%S')"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
    
    - name: Repository label
      id: rep
      run: |
        username="elevenlevel" # заменить на актуальное значение
        repname="BlAddons" # заменить на актуальное значение

        REP="$username/$repname"
        echo "rep=$REP" >> $GITHUB_OUTPUT
    
    - name: Process changed blender manifests and create zips
      id: pack
      run: |
        changed_toml="${{ steps.changed_files.outputs.changed_toml }}"
        changed="${{ steps.changed_files.outputs.files }}"

        # if [ -z "$changed" ] || ! echo "$changed" | grep -q 'blender_manifest.toml'; then
        #   echo "No changed blender_manifest.toml found, skipping packaging."
        #   echo "created=false" >> $GITHUB_OUTPUT
        #   exit 0
        # fi

        # проверяем есть ли файл blender_manifest.toml в текущем коммите
        touched_manifests=0
        zip_paths=""
        zip_sizes=""
        zip_hashes=""

        for file in $changed; do
          if [[ "$file" == */blender_manifest.toml ]]; then
            touched_manifests=1
          fi
        done

        # проверяем есть ли toml файл в текущем коммите
        if [ $touched_manifests -eq 0 ]; then 
          echo "No blender_manifest.toml files were processed." 
          echo "created=false" >> $GITHUB_OUTPUT
          exit 0
        else
          declare -A toml_fields

          for file in $changed; do
            if [[ "$file" == */blender_manifest.toml ]]; then
              dir=$(dirname "$file")
              id=$(python -c "import toml; print(toml.load('$file')['id'])")

              toml_fields["${id}_schema_version"]="1.0.0"
              toml_fields["${id}_id"]="$id"
              toml_fields["${id}_name"]="$id"
              toml_fields["${id}_version"]="0.0.0"
              toml_fields["${id}_tagline"]="This is Extreme Developers extension"
              toml_fields["${id}_maintainer"]="Extreme Developers"
              toml_fields["${id}_type"]="add-on" # Supported types: "add-on", "theme"
              toml_fields["${id}_blender_version_min"]="0.0.0"
              toml_fields["${id}_blender_version_max"]="20.1.0"
              toml_fields["${id}_website"]="https://extreme-developers.ru/"
              toml_fields["${id}_tags"]='["default"]'
              toml_fields["${id}_license"]='["SPDX:GPL-3.0-or-later"]'
              toml_fields["${id}_copyright"]='["2002-%Y Extreme Developers"]'
              toml_fields["${id}_python_versions"]='[3.11]'
              toml_fields["${id}_paths_exclude_pattern"]='["__pycache__/", "/.git/", "/*.zip"]'

              for key in "${!toml_fields[@]}"; do
                python_key="${key#${id}_}"
                value=$(python3 -c "import toml; print(toml.load('$file').get('$python_key', ''))" 2>/dev/null)

                if [ "$value" != "" ]; then # если поле в файле toml есть, то берем значение из файла
                  toml_fields[${key}]="$value"
                else # иначе берем дефолтное значение
                  toml_fields[${key}]=${toml_fields[${key}]}
                fi
              done
              
              zipname="${toml_fields["${id}_id"]}_${toml_fields["${id}_version"]}-blender-${toml_fields["${id}_blender_version_min"]}.zip"
              
              (cd "$dir" && zip -r "../$zipname" . -x "__pycache__/*" "*.pyc" ".vscode/*") || (echo "Failed to create zip: $zipname" && exit 1)
              touched_manifests=1

              zip_path="$dir/../$zipname"
              size=$(stat -c%s "$zip_path")
              hash=sha256:$(sha256sum "$zip_path" | cut -d' ' -f1)
              _zip_paths+="$zip_path,"
              _zip_sizes+="${size},"
              _zip_hashes+="${hash},"
              
              REP=${{ steps.rep.outputs.rep }}
              TAG=${{ steps.tag.outputs.tag }}
              archive_url="https://github.com/$REP/releases/download/$TAG/$zipname"

              echo "zipname variable is: $zipname"
              echo "Archiving directory: $dir"
            fi
          done

          zip_paths=${_zip_paths%,}
          zip_sizes=${_zip_sizes%,}
          zip_hashes=${_zip_hashes%,}
          echo "zip_paths=$zip_paths" >> $GITHUB_OUTPUT
          echo "zip_sizes=$zip_sizes" >> $GITHUB_OUTPUT
          echo "zip_hashes=$zip_hashes" >> $GITHUB_OUTPUT

          description=""

          IFS=',' read -r -a paths_array <<< "$zip_paths"
          IFS=',' read -r -a sizes_array <<< "$zip_sizes"
          IFS=',' read -r -a hashes_array <<< "$zip_hashes"

          for i in "${!paths_array[@]}"; do
            size_clean=$(echo "${sizes_array[i]}" | xargs)
            hash_clean=$(echo "${hashes_array[i]}" | xargs)
            path_clean=$(echo "${paths_array[i]}" | xargs)

            description+="Архив: $path_clean
            Size: $size_clean байт
            Hash: sha256:$hash_clean
            
            "
          done

          echo "release_description<<EOF" >> $GITHUB_OUTPUT
          echo "$description" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ $touched_manifests -eq 0 ]; then
            echo "No blender_manifest.toml files were processed."
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          else
            toml_fields[${id}_archive_url]="$archive_url"
            toml_fields[${id}_archive_size]="$size_clean"
            toml_fields[${id}_archive_hash]="$hash_clean"
            
            echo "created=true" >> $GITHUB_OUTPUT
            release_name="${toml_fields["${id}_id"]}_${toml_fields["${id}_version"]}-blender-${toml_fields["${id}_blender_version_min"]}"
            echo "release_name=$release_name" >> $GITHUB_OUTPUT
            addon_name="${toml_fields["${id}_name"]}"
            echo "addon_name=$addon_name" >> $GITHUB_OUTPUT
            # echo "toml_fields='${!toml_fields[@]}'" >> $GITHUB_OUTPUT
            output=""

            # выводим весь словарь в переменную toml_fields ===========
            for key in "${!toml_fields[@]}"; do
              value="${toml_fields[$key]}"
              output+="|${key}|:|${value}|,"
            done
            
            output=${output%,} # Убираем последнюю запятую
            echo "toml_fields=$output" >> $GITHUB_OUTPUT
            # ============================
            
            # выводим все поля словаря toml_fields для дебага
            for key in "${!toml_fields[@]}"; do
              python_key=${key#${id}_}
              echo "toml_fields: $key = ${toml_fields[$key]}"
            done
          fi
        fi

    - name: Edit index.json with Python
      if: steps.pack.outputs.created == 'true'
      env:
        toml_fields: ${{ steps.pack.outputs.toml_fields }}
      run: |
        python3 - <<EOF
        import json
        import os
        
        toml_fields = os.environ['toml_fields']

        # приводим полученную строку к подходящему для json.loads виду
        toml_fields = toml_fields.replace("|[", '[')
        toml_fields = toml_fields.replace("]|", ']')
        toml_fields = '{' + toml_fields.replace('|', '"') + '}'  # заменяет |, на двойные кавычки
        toml_fields = toml_fields.replace("'", '"')
        
        toml_fields_json = json.loads(toml_fields)
        print("toml_fields_json: ", toml_fields_json)
        # определяем id аддона из toml_fields_json
        addon_id = ""
        for key, value in toml_fields_json.items():
          print(key + ": " + str(value))
          if "_id" in key:
              addon_id = value
              break
        print("addon_id = ", addon_id)
        
        # читаем содержисое файла index.json
        with open('index.json', 'r', encoding='utf-8') as f:
          data = json.load(f)
        
        # находим блок аддона по id
        item = None # это словарь полей аддона
        index = None # это номер блока аддона в файле index.json
        for i, elem in enumerate(data.get('data', [])):
          if elem.get('id') == addon_id:
              item = elem
              index = i
              break
        print("item = ", item)

        # если item == None, занчит аддона в index.json еще нет

        new_entry = {}
        for key, value in toml_fields_json.items():
          simple_key = key.replace(addon_id + "_", "")
          if simple_key=="archive_size":
            new_entry[simple_key] = int(value)
          else:
            new_entry[simple_key] = value
        
        print("new_entry: ", str(new_entry))

        if item is not None: # если аддон в index.json уже указан
          print("Addon elready exist in index.json")
          # Чистим все поля блока аддона
          keys_to_remove = list(item.keys())
          for k in keys_to_remove:
            del item[k]
          item.update(new_entry)
          # data['data'][index] = new_entry # заменяем весь элемент новым
        else:
          print("Create new part inside index.json")
          data.setdefault('data', []).append(new_entry)  # добавляем новый
        
        # item.update(new_entry)
        # print("item updated")
        with open('index.json', 'w', encoding='utf-8') as f:
          json.dump(data, f, ensure_ascii=False, indent=2)
        EOF
        # my error
    
    - name: Commit and push changes
      if: steps.pack.outputs.created == 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add index.json
        if ! git diff --cached --quiet; then
          git commit -m "Update index.json"
          git push
        else
          echo "No changes to commit"
        fi

    - name: Create and push tag
      if: steps.pack.outputs.created == 'true'
      id: push
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        if ! git diff --cached --quiet; then
          git commit -m "Update index.json"
          git push
        else
          echo "No changes to commit"
        fi

    - name: Create GitHub Release
      if: steps.pack.outputs.created == 'true'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        #tag_name: ${{ steps.pack.outputs.addon_name }}_latest
        release_name: ${{ steps.pack.outputs.addon_name }}_latest

        body: |
          Версия релиза: ${{ steps.pack.outputs.release_name }}

          Вставьте этот путь в качестве репозитория в разделе Git Extensions параметров blender:
            https://raw.githubusercontent.com/${{ steps.rep.outputs.rep }}/refs/heads/main/index.json
          
          Таким образом у вас всегда будут самые свежие версии аддонов.

          ${{ steps.pack.outputs.release_description }}
        
        draft: false
        prerelease: false

    - name: Upload each release zip file to GitHub Release
      if: steps.pack.outputs.created == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        shopt -s nullglob

        IFS=',' read -r -a dirs_array <<< "${{ steps.pack.outputs.zip_paths }}"
        
        set -x
        
        for path in "${dirs_array[@]}"; do
          echo "path: ${path}"
          # addon_name_latest=${{ steps.pack.outputs.addon_name }}
          # addon_name_latest="${addon_name_latest// /_}"  # заменяем пробелы на _
          addon_tag=${{ steps.tag.outputs.tag }}
          addon_tag="${addon_tag// /_}"  # заменяем пробелы на _
          gh release upload "$addon_tag" "$path" --clobber
        done