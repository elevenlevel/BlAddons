name: Build and Release ZIP for Changed Blender Addons

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install Python toml parser
      run: pip install toml

    - name: Get changed files
      id: changed_files
      run: |
        git fetch --depth=2
        echo "files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})" >> $GITHUB_OUTPUT

    - name: Install zip
      run: sudo apt-get update && sudo apt-get install -y zip
    
    - name: Process changed blender manifests and create zips
      id: pack
      run: |
        changed="${{ steps.changed_files.outputs.files }}"

        if [ -z "$changed" ] || ! echo "$changed" | grep -q 'blender_manifest.toml'; then
          echo "No changed blender_manifest.toml found, skipping packaging."
          echo "created=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # проверяем есть ли файл blender_manifest.toml в текущем коммите
        touched_manifests=0
        for file in $changed; do
          if [[ "$file" == */blender_manifest.toml ]]; then
            touched_manifests=1
          fi
        done

        # если файла blender_manifest.toml в коммите нет
        if [ $touched_manifests -eq 0 ]; then 
          echo "No blender_manifest.toml files were processed."
          echo "created=false" >> $GITHUB_OUTPUT
          exit 0
        else
          for file in $changed; do
            if [[ "$file" == */blender_manifest.toml ]]; then
              dir=$(dirname "$file")
              id=$(python -c "import toml; print(toml.load('$file')['id'])")
              version=$(python -c "import toml; print(toml.load('$file')['version'])")
              blender_version=$(python -c "import toml; print(toml.load('$file')['blender_version_min'])")
              zipname="${id}_${version}-blender-${blender_version}.zip"

              echo "Archiving directory: $dir"
              ls -la "$dir"
              
              (cd "$dir" && zip -r "../$zipname" . -x "__pycache__/*" "*.pyc") || (echo "Failed to create zip: $zipname" && exit 1)
              touched_manifests=1
            fi
          done

          if [ $touched_manifests -eq 0 ]; then
            echo "No blender_manifest.toml files were processed."
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "created=true" >> $GITHUB_OUTPUT
            echo "release_name=$zipname" >> $GITHUB_OUTPUT
          fi
        fi
    
    - name: List created zip files
      run: ls -l *.zip || echo "No zip files found"

    - name: Create and push tag
      if: steps.pack.outputs.created == 'true'
      id: tag
      run: |
        TAG="release-$(date +'%Y%m%d%H%M%S')"
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git tag $TAG
        git push origin $TAG
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: steps.pack.outputs.created == 'true'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        release_name: ${{ steps.pack.outputs.release_name }}
        body: |
          Автоматический релиз.
          Скачать zip:
          [${{ steps.pack.outputs.release_name }}] (https://github.com/elevenlevel/BlAddons/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.pack.outputs.release_name }})
        draft: false
        prerelease: false

    - name: Upload each release zip file to GitHub Release
      if: steps.pack.outputs.created == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        shopt -s nullglob
        files=(*.zip)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No zip files to upload"
          exit 0
        fi
        for zipfile in "${files[@]}"; do
          echo "Uploading $zipfile"
          gh release upload ${{ steps.tag.outputs.tag }} "$zipfile" --clobber
        done 